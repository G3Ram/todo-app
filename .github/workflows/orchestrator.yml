# The foreman. When an agent PR is merged, pick the next queued issue and label it
# agent-ready, which starts claude-implement.yml. Your merge is the gate between tasks.
#
# Queue issues:   gh issue edit <N> --add-label queued
# Turn on:        gh variable set ORCHESTRATOR_ENABLED --body true
# Pause:          gh variable set ORCHESTRATOR_ENABLED --body false
# Kick off:       gh workflow run orchestrator.yml
name: Orchestrator

on:
  pull_request:
    types: [closed]
  workflow_dispatch:

concurrency:
  group: orchestrator
  cancel-in-progress: false

jobs:
  next-task:
    if: |
      vars.ORCHESTRATOR_ENABLED == 'true' && (
        github.event_name == 'workflow_dispatch' ||
        (github.event.pull_request.merged == true &&
         startsWith(github.event.pull_request.head.ref, 'agent/'))
      )
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
      pull-requests: write
      id-token: write
    env:
      GH_TOKEN: ${{ secrets.FACTORY_PAT }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - uses: anthropics/claude-code-action@v1
        id: claude
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: "/orchestrate ${{ github.event.pull_request.number }}"
          # Picking the next issue is simple bookkeeping, so it runs on the cheapest model.
          # Change with: gh variable set MODEL_ORCHESTRATOR --body sonnet
          claude_args: |
            --model ${{ vars.MODEL_ORCHESTRATOR || 'haiku' }}
            --max-turns 15
            --allowedTools "Read,Bash(gh issue list:*),Bash(gh issue view:*),Bash(gh issue edit:*),Bash(gh issue comment:*),Bash(gh pr list:*),Bash(gh pr view:*),Bash(gh pr comment:*)"

      - name: Usage report
        if: always()
        env:
          EXEC_FILE: ${{ steps.claude.outputs.execution_file || format('{0}/claude-execution-output.json', runner.temp) }}
          USAGE_OUT: ${{ runner.temp }}/agent-usage.json
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: bash scripts/agent-usage.sh "$EXEC_FILE" orchestrator

      - name: Save usage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: agent-usage
          path: ${{ runner.temp }}/agent-usage.json
          if-no-files-found: ignore
          retention-days: 90
