# The helper. Mention @claude in a new issue, an issue or PR comment, a reply on a code
# line, or a submitted review, to ask a question
# or request a change (for example, "@claude fix the review comments").
# For implementing a whole issue, use the agent-ready label instead (claude-implement.yml).
name: Claude

on:
  issues:
    types: [opened]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  # A review submitted with a summary comment ("Review changes" > Comment).
  pull_request_review:
    types: [submitted]

concurrency:
  group: claude-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  claude:
    if: |
      (github.event_name == 'issues' && contains(github.event.issue.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      ((github.event_name == 'issue_comment' || github.event_name == 'pull_request_review_comment') &&
        contains(github.event.comment.body, '@claude'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read   # lets Claude read CI results on PRs
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      # Keep Node even if you drop the frontend: Ponytail's hooks need it.
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --prefix web
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --directory api

      - uses: anthropics/claude-code-action@v1
        id: claude
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: |
            https://github.com/DietrichGebert/ponytail.git
            https://github.com/anthropics/claude-code.git
          plugins: |
            ponytail@ponytail
            security-guidance@claude-code-plugins
          # Change with: gh variable set MODEL_HELPER --body opus
          claude_args: |
            --model ${{ vars.MODEL_HELPER || 'sonnet' }}
            --max-turns 40

      - name: Usage report
        if: always()
        env:
          EXEC_FILE: ${{ steps.claude.outputs.execution_file || format('{0}/claude-execution-output.json', runner.temp) }}
          USAGE_OUT: ${{ runner.temp }}/agent-usage.json
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: bash scripts/agent-usage.sh "$EXEC_FILE" helper

      - name: Save usage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: agent-usage
          path: ${{ runner.temp }}/agent-usage.json
          if-no-files-found: ignore
          retention-days: 90