# A second Claude pass that reviews every PR, including the ones Claude wrote.
# Posts inline comments on problems, or one summary comment if it finds none.
# It does not approve or merge. You still click merge.
name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

concurrency:
  group: review-${{ github.event.pull_request.number }}
  cancel-in-progress: true   # a new push makes the old review stale

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Agent PRs are opened by Claude, so allow it as the actor.
          # Safe: this job only comments, it never pushes, so it can't loop.
          allowed_bots: "claude,claude[bot]"
          plugin_marketplaces: "https://github.com/anthropics/claude-code.git"
          plugins: "code-review@claude-code-plugins"
          prompt: "/code-review:code-review --comment ${{ github.repository }}/pull/${{ github.event.pull_request.number }}"
          claude_args: '--allowedTools "mcp__github_inline_comment__create_inline_comment"'