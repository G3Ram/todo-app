[project]
name = "todo-api"
version = "0.1.0"
description = "Backend for the todo app"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx>=0.28",
    "ruff>=0.8",
    "mypy>=1.13",
    "pytest-cov>=7.1.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
strict = true
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: needs the Firestore emulator (run via firebase emulators:exec)",
]
# Integration tests are opt-in: run them with `pytest -m integration`.
addopts = "-m 'not integration'"

[tool.coverage.run]
source = ["app"]

[tool.coverage.report]
# CI fails below this. Raise it over time, never lower it to get a PR through.
fail_under = 85
show_missing = true
